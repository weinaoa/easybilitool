plugins { id 'com.android.application' }
android {
    namespace 'com.weinaoa.easybilitool'
    buildFeatures { buildConfig true }
    compileSdk 36
    defaultConfig {
        applicationId 'com.weinaoa.easybilitool'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { compileOnly files('libs/libxposed-api-102.0.0.jar') }
